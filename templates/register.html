
<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
</head>

<body>

    <h1>User Registration</h1>

    <form action="/register" method="post">

        <label>Full Name:</label>
        <input type="text" name="full_name"
               placeholder="Enter your full name" required>
        <br><br>

        <label>Email Address:</label>
        <input type="email" name="email"
               placeholder="Enter your email address" required>
        <br><br>

        <label>Phone Number:</label>
        <input type="tel" name="phone"
               placeholder="Enter your phone number" required>
        <br><br>

        <label>Date of Birth:</label>
        <input type="date" name="dob" required>
        <br><br>

        <label>Select Your Role:</label>
        <select name="role" id="role" required>
            <option value="">-- Select Role --</option>
            <option value="Teacher">I am a Teacher</option>
            <option value="Student">I am a Student</option>
        </select>
        <br><br>

        <div id="subjectDiv" style="display:none;">
            <label>Subject:</label>
            <input type="text" name="subject" id="subject">
            <br><br>
        </div>

        <div id="standardDiv" style="display:none;">
            <label>Standard/Class:</label>
            <input type="text" name="standard" id="standard">
            <br><br>
        </div>

        <label>Password:</label>
        <input type="password" name="password"
               placeholder="Enter your password" required>
        <br><br>

        <button type="submit">Register</button>

    </form>

    <p>
        Already have an account?
        <a href="/">Login</a>
    </p>

    <script>
        const role = document.getElementById("role");
        const subjectDiv = document.getElementById("subjectDiv");
        const standardDiv = document.getElementById("standardDiv");
        const subject = document.getElementById("subject");
        const standard = document.getElementById("standard");

        role.addEventListener("change", function () {

            subjectDiv.style.display = "none";
            standardDiv.style.display = "none";

            subject.required = false;
            standard.required = false;

            subject.value = "";
            standard.value = "";

            if (this.value === "Teacher") {
                subjectDiv.style.display = "block";
                subject.required = true;
            }

            if (this.value === "Student") {
                standardDiv.style.display = "block";
                standard.required = true;
            }
        });
    </script>

</body>
</html>
