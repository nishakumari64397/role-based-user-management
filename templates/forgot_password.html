<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password</title>
</head>

<body>

    <h1>Forgot Password</h1>

    <p>Enter your registered email address.</p>

    <form action="/forgot-password" method="post">

        <p>Email Address</p>

        <input
            type="email"
            name="email"
            placeholder="Enter your email"
            required
        >

        <br><br>

        <button type="submit">Send OTP</button>

    </form>

    <br>

    <a href="/">
        Back to Login
    </a>

</body>
</html>
