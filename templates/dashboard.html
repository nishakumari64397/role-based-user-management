<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>

    <style>
        .profile-picture {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #333;
            display: block;
        }

        .profile-placeholder {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background-color: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            border: 4px solid #333;
        }

        form {
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <h1>Welcome to Your Dashboard</h1>

    <!-- Profile Picture -->
    {% if user[9] %}

        <img
            src="/uploads/{{ user[9] }}"
            alt="Profile Picture"
            class="profile-picture"
        >

        <form action="/delete-profile-picture" method="post">
            <button type="submit">Delete Picture</button>
        </form>

    {% else %}

        <div class="profile-placeholder">
            👤
        </div>

    {% endif %}


    <h2>Profile Details</h2>

    <p><strong>Full Name:</strong> {{ user[1] }}</p>
    <p><strong>Email:</strong> {{ user[2] }}</p>
    <p><strong>Phone Number:</strong> {{ user[3] }}</p>
    <p><strong>Date of Birth:</strong> {{ user[4] }}</p>


    <h3>Profile Picture</h3>

    <form
        action="/upload-profile-picture"
        method="post"
        enctype="multipart/form-data"
    >

        <input
            type="file"
            name="profile_picture"
            accept="image/*"
            required
        >

        <br><br>

        <button type="submit">
            Upload / Replace Picture
        </button>

    </form>


    <br>
  <a href="/edit-profile">
    <button type="button">Edit Profile</button>
</a>

<br><br>

<a href="/change-password">
    <button type="button">Change Password</button>
</a>

<br><br>

<a href="/logout">
    <button type="button">Logout</button>
</a>

<a href="/dashboard">Back to Dashboard</a>   
    

</body>
</html>
