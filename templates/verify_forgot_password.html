<!DOCTYPE html>
<html>
<head>
    <title>Verify Forgot Password OTP</title>
</head>

<body>

    <h1>Verify OTP</h1>

    <p>Enter the OTP shown in your terminal.</p>

    <form action="/verify-forgot-password-otp" method="post">

        <p>OTP</p>

        <input
            type="text"
            name="otp"
            placeholder="Enter 6-digit OTP"
            required
        >

        <br><br>

        <button type="submit">Verify OTP</button>

    </form>

</body>
</html>
